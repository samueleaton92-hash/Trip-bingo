  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex:0 0 auto;
    font-family:'Special Elite', monospace;

    color:var(--ink-soft);

    background:var(--paper);
    border-top:1.5px solid var(--accent);
    padding:16px 14px 90px;
    position:relative;

    position:absolute; top:14px; right:14px;

    line-height:1.1;

  }
  .cell {

    font-size:10px; line-height:1.25;

function defaultState() {
  const s = {};
  DESTINATIONS.forEach(d => {
    s[d.id] = Array(d.items.length).fill(null);
  });
  return s;
}
function fillGaps(s) {
  DESTINATIONS.forEach(d => {
    const raw = s[d.id];
    const reconstructed = Array(d.items.length).fill(null);
    if (Array.isArray(raw)) {
      raw.forEach((v, i) => {
        if (i < d.items.length && (v === "becky" || v === "sam")) reconstructed[i] = v;
      });
    } else if (raw && typeof raw === "object") {
      // Firebase collapses sparse arrays into a plain object keyed by index —
      // reconstruct a real array from those keys instead of discarding the data.
      Object.keys(raw).forEach(k => {
        const i = parseInt(k, 10);
        if (!isNaN(i) && i >= 0 && i < d.items.length) {
          const v = raw[k];
          if (v === "becky" || v === "sam") reconstructed[i] = v;
        }
      });
    }
    s[d.id] = reconstructed;
  });
  return s;
}

connectedRef.on("value", (snap) => {

  renderStatus();
});

finishedRef.on("value", (snap) => {
  finished = snap.val() || {};
  render();
});

stateRef.on("value", (snap) => {
  const val = snap.val();
  if (val) {
    state = fillGaps(val);
  } else if (!hasLoadedOnce) {
    state = defaultState();
    stateRef.set(state);
  }
  hasLoadedOnce = true;
  render();
}, (err) => {
  if (!state) state = defaultState();
  hasLoadedOnce = true;
  render();
});

function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function() {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function seededShuffle(arr, seedStr) {
  const rand = hashSeed(seedStr);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand() % (i + 1);
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

  if (!dest._orderCache[profile]) {
    const base = Array.from({length: dest.items.length}, (_, i) => i);
    dest._orderCache[profile] = seededShuffle(base, dest.id + "-" + profile);
  }
  return dest._orderCache[profile];
}

function checkLines(marks, size, freeIndex) {
  const total = size * size;
  const full = [];
  let markPos = 0;
  for (let i = 0; i < total; i++) {
    if (freeIndex !== null && i === freeIndex) full.push(true);
    else { full.push(marks[markPos]); markPos++; }
  }
  const idxRange = Array.from({length: size}, (_, k) => k);
  const winCells = new Set();
  const rowCells = new Set();
  const colCells = new Set();
  let hasRow = false, hasCol = false;
  for (let r = 0; r < size; r++) {
    const line = idxRange.map(c => r * size + c);
    if (line.every(idx => full[idx])) { hasRow = true; line.forEach(idx => { winCells.add(idx); rowCells.add(idx); }); }
  }
  for (let c = 0; c < size; c++) {
    const line = idxRange.map(r => r * size + c);
    if (line.every(idx => full[idx])) { hasCol = true; line.forEach(idx => { winCells.add(idx); colCells.add(idx); }); }
  }
  return { hasRow, hasCol, rowCells, colCells, winCells };
}

function render() {
  if (!state) { renderStatus(); return; }
  renderProfileSwitch();
  renderTabs();
  if (activeId === "overall") { renderOverallView(); renderStatus(); return; }
  const dest = DESTINATIONS.find(d => d.id === activeId);
  document.documentElement.style.setProperty("--accent", dest.accent);
  const owners = state[dest.id];
  const size = dest.size;
  const freeIndex = dest.freeIndex;
  const total = size * size;
  const order = getDisplayOrder(dest, activeProfile);

  // Row/column detection runs on a FIXED, unshuffled arrangement (canonical item order 0..N-1)
  // so a completed line means the same thing regardless of which profile's shuffled view is open —
  // it must never depend on whichever person happens to be looking.
  const claimedBoolCanonical = owners.map(v => v !== null);
  const { hasRow, hasCol, rowCells, colCells, winCells: canonicalWinCells } = checkLines(claimedBoolCanonical, size, freeIndex);
  const blackout = owners.every(v => v !== null);
  const isFinished = !!finished[dest.id];
  const decided = blackout || isFinished;
  const profileLabel = activeProfile === "becky" ? "🔴 Becky" : "🔵 Sam";
  const beckyCount = owners.filter(v => v === "becky").length;
  const samCount = owners.filter(v => v === "sam").length;

  // canonical full-grid position -> canonical item index (identity mapping, null for the free cell)
  const canonicalFullToItem = [];
  {
    let ci = 0;
    for (let i = 0; i < total; i++) {
      if (freeIndex !== null && i === freeIndex) canonicalFullToItem.push(null);
      else { canonicalFullToItem.push(ci); ci++; }
    }
  }
  function tally(cellSet) {
    let becky = 0, sam = 0;
    cellSet.forEach(fullIdx => {
      const canonical = canonicalFullToItem[fullIdx];
      if (canonical === null) return;
      const owner = owners[canonical];
      if (owner === "becky") becky++;
      else if (owner === "sam") sam++;
    });
    return { becky, sam };
  }
  function leaderLabel(counts) {
    if (counts.becky > counts.sam) return "🔴 Becky";
    if (counts.sam > counts.becky) return "🔵 Sam";
    return "Tied";
  }

  // which canonical ITEMS (not grid positions) are part of a completed line —
  // used to highlight the right squares no matter where they land in this profile's shuffle
  const winItemIndices = new Set(
    [...canonicalWinCells].map(fullIdx => canonicalFullToItem[fullIdx]).filter(v => v !== null)
  );

  let rowBannerHtml = "";
  if (hasRow) {
    const c = tally(rowCells);
    rowBannerHtml = `
      <div class="bingo-banner show">
        <div class="bb-title">★ Row! ★ ${leaderLabel(c)} leads (${c.becky}-${c.sam})</div>
        <div class="bb-text">${dest.hLinePrize}</div>
      </div>`;
  }
  let colBannerHtml = "";
  if (hasCol) {
    const c = tally(colCells);
    colBannerHtml = `
      <div class="bingo-banner show">
        <div class="bb-title">★ Column! ★ ${leaderLabel(c)} leads (${c.becky}-${c.sam})</div>
        <div class="bb-text">${dest.vLinePrize}</div>
      </div>`;
  }
  let winnerLabel = "";
  if (decided) {
    winnerLabel = beckyCount > samCount ? "🔴 Becky wins!" : samCount > beckyCount ? "🔵 Sam wins!" : "It's a tie!";
  }
  const prizeTitle = blackout
    ? `🔓 ${dest.name} unlocked — ${winnerLabel}`
    : `🏁 ${dest.name} finished early — ${winnerLabel}`;

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="stamp-badge">
      <span class="flag">${dest.flag}</span>
      <span class="code">${dest.code}</span>
    </div>
    <div class="eyebrow">${dest.dates} · Tapping as ${profileLabel}</div>
    <h1>${dest.name}</h1>
    <span class="route">${dest.route}</span>
    ${rowBannerHtml}
    ${colBannerHtml}
    <div class="grid" id="grid" style="grid-template-columns:repeat(${size},1fr)"></div>
    <div class="prize ${decided ? 'show' : ''}">
      <div class="prize-title">${prizeTitle}</div>
      <div class="prize-text">${dest.prize}</div>
    </div>
  `;
  const grid = document.getElementById("grid");
  let posIdx = 0;
  for (let i = 0; i < total; i++) {
    const el = document.createElement("div");
    if (freeIndex !== null && i === freeIndex) {
      el.className = "cell free" + (decided ? " won" : "");
      el.innerHTML = `<span class="lock">${decided ? "★" : "🔒"}</span>`;
    } else {
      const canonicalIdx = order[posIdx];
      const owner = owners[canonicalIdx];
      const ownerClass = owner ? ` owner-${owner}` : "";
      const blockedClass = (owner && owner !== activeProfile) ? " blocked" : "";
      el.className = "cell" + ownerClass + blockedClass + (winItemIndices.has(canonicalIdx) ? " win" : "");
      el.textContent = dest.items[canonicalIdx];
      el.onclick = () => {
        const current = state[dest.id][canonicalIdx];
        let newVal;
        if (current === activeProfile) newVal = null;
        else if (current === null) newVal = activeProfile;
        else return;
        state[dest.id][canonicalIdx] = newVal;
        render();
        saveCell(dest.id, canonicalIdx, newVal);
      };
      posIdx++;
    }
    grid.appendChild(el);
  }
  document.getElementById("progress").textContent =
    `${owners.filter(v => v !== null).length}/${dest.items.length} ticked · 🔴 Becky ${beckyCount} · 🔵 Sam ${samCount}` +
    (isFinished && !blackout ? " · 🏁 finished early" : "");
  const finishBtn = document.getElementById("finishBtn");
  if (finishBtn) {
    if (blackout) {
      finishBtn.style.display = "none";
    } else {
      finishBtn.style.display = "";
      finishBtn.textContent = isFinished ? "Reopen" : "Finish";
      finishBtn.className = "finish-btn" + (isFinished ? " is-finished" : "");
    }
  }
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.style.display = "";
  renderStatus();
}

function renderOverallView() {
  document.documentElement.style.setProperty("--accent", "#7A5C93");
  const progressEl = document.getElementById("progress");
  if (progressEl) progressEl.textContent = "";
  const finishBtn = document.getElementById("finishBtn");
  if (finishBtn) finishBtn.style.display = "none";
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.style.display = "none";

  let tabsBecky = 0, tabsSam = 0, tabsTied = 0, tabsDecided = 0;
  const rows = DESTINATIONS.map(d => {
    const owners = state[d.id] || [];
    const blackout = owners.length > 0 && owners.every(v => v !== null);
    const isFinished = !!finished[d.id];
    const decided = blackout || isFinished;
    const beckyCount = owners.filter(v => v === "becky").length;
    const samCount = owners.filter(v => v === "sam").length;
    let winnerHtml;
    if (!decided) {
      winnerHtml = `<span class="dwinner pending">in progress</span>`;
    } else {
      tabsDecided++;
      if (beckyCount > samCount) { tabsBecky++; winnerHtml = `<span class="dwinner">🔴 Becky</span>`; }
      else if (samCount > beckyCount) { tabsSam++; winnerHtml = `<span class="dwinner">🔵 Sam</span>`; }
      else { tabsTied++; winnerHtml = `<span class="dwinner">Tied</span>`; }
    }
    return `<div class="overall-row"><span class="dname">${d.flag} ${d.name}</span>${winnerHtml}</div>`;
  }).join("");

  const allDecided = tabsDecided === DESTINATIONS.length;
  let championHtml = "";
  if (allDecided) {
    const champion = tabsBecky > tabsSam ? "🔴 Becky" : tabsSam > tabsBecky ? "🔵 Sam" : "It's a tie";
    championHtml = `
      <div class="overall-champion">
        <div class="oc-title">🏆 TRIP CHAMPION: ${champion}</div>
        <div class="oc-text">${FINAL_PRIZE_MESSAGE}</div>
      </div>`;
  } else {
    championHtml = `
      <div class="overall-progress">${tabsDecided}/${DESTINATIONS.length} destinations decided · finish or blackout the rest to unlock the final prize</div>`;
  }

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="eyebrow">Whole trip</div>
    <div class="overall-title">Trip Leaderboard</div>
    ${rows}
    <div class="overall-tally">🔴 Becky: ${tabsBecky} tabs · 🔵 Sam: ${tabsSam} tabs${tabsTied ? ` · Tied: ${tabsTied}` : ""}</div>
    ${championHtml}
  `;
}

function resetCurrent() {
  if (confirm("Clear all ticks on this card for both of you?")) {
    const dest = DESTINATIONS.find(d => d.id === activeId);
    const cleared = Array(dest.items.length).fill(null);
    state[activeId] = cleared;
    if (finished[activeId]) {
      finished[activeId] = false;
      saveFinished(activeId, false);
    }
    render();
    saveWholeCard(activeId, cleared);
  }
}

function finishCard() {
  const dest = DESTINATIONS.find(d => d.id === activeId);
  const alreadyFinished = !!finished[activeId];
  if (alreadyFinished) {
    if (confirm(`Reopen ${dest.name}? This hides the winner banner again until you finish it once more.`)) {
      finished[activeId] = false;
      saveFinished(activeId, false);
      render();
    }
    return;
  }
  if (confirm(`Finish ${dest.name} now and declare a winner based on the current tally?`)) {
    finished[activeId] = true;
    saveFinished(activeId, true);
    render();
  }
}

renderStatus();
</script>
